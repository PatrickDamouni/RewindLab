[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rewindlab"
version = "0.1.0"
description = "A small, reproducible point-in-time data replay demo"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rewindlab = "rewindlab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rewindlab = ["data/*.jsonl", "data/*.json"]
